# Grafana Cloud MCP Server
# Deploy with: wrangler deploy

name = "grafana-cloud-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# OAuth requires Durable Objects for session management
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "GrafanaCloudMCP"

[[migrations]]
tag = "v1"
new_classes = ["GrafanaCloudMCP"]

# KV namespace for OAuth token storage
# Create with: wrangler kv namespace create OAUTH_KV
# Then update the id below with the returned namespace ID
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "8893cd7fdcd84638b11f7c9c9c39baf5"

# Environment variables (set via wrangler secret)
# GRAFANA_CLOUD_URL - Your Grafana Cloud instance URL (e.g., https://myorg.grafana.net)
# GRAFANA_SERVICE_ACCOUNT_TOKEN - Your Grafana Cloud service account token

# For custom domain routing, uncomment and configure:
# workers_dev = false
# route = { pattern = "grafana-mcp.yourdomain.com/*", zone_name = "yourdomain.com" }
